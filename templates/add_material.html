{% extends "base.html" %}

{% block title %}Add Material{% endblock %}
{% block page_heading %}Add Material{% endblock %}

{% block content %}

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Material Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Material Type</label>
                            <select name="material_type" class="form-select" required>
                                <option value="pineapple_peel">Pineapple Peel</option>
                                <option value="orange_peel">Orange Peel</option>
                                <option value="citronella">Citronella</option>
                                <option value="neem">Neem</option>
                                <option value="eucalyptus">Eucalyptus</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <input type="number" step="0.1" name="quantity" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Unit</label>
                            <select name="unit" class="form-select">
                                <option value="kg">kg</option>
                                <option value="L">L (Litres)</option>
                                <option value="units">units</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Minimum Stock Level</label>
                            <input type="number" step="0.1" name="minimum_stock" class="form-control" value="10" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Supplier <span class="text-muted">(Optional)</span></label>
                            <input type="text" name="supplier" class="form-control" placeholder="e.g. Kumasi Central Market">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Add Material</button>
                            <a href="/materials" class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

{% endblock %}
