{% extends "base.html" %}

{% block title %}Edit Batch{% endblock %}
{% block page_heading %}Edit Batch{% endblock %}

{% block content %}

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" name="product_name" class="form-control" value="{{ batch.product_name }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Product Type</label>
                            <select name="product_type" class="form-select" required>
                                <option value="coil" {% if batch.product_type == "coil" %}selected{% endif %}>Coil</option>
                                <option value="aerosol" {% if batch.product_type == "aerosol" %}selected{% endif %}>Aerosol</option>
                                <option value="cream" {% if batch.product_type == "cream" %}selected{% endif %}>Cream</option>
                                <option value="essence" {% if batch.product_type == "essence" %}selected{% endif %}>Essence</option>
                                <option value="other" {% if batch.product_type == "other" %}selected{% endif %}>Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Peels Used (kg)</label>
                            <input type="number" step="0.1" name="peels_used" class="form-control" value="{{ batch.peels_used }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantity Produced (units)</label>
                            <input type="number" name="quantity_produced" class="form-control" value="{{ batch.quantity_produced }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" name="start_date" class="form-control" value="{{ batch.start_date.strftime('%Y-%m-%d') }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">End Date</label>
                            <input type="date" name="end_date" class="form-control" value="{{ batch.end_date.strftime('%Y-%m-%d') }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select">
                                <option value="planned" {% if batch.status == "planned" %}selected{% endif %}>Planned</option>
                                <option value="in_progress" {% if batch.status == "in_progress" %}selected{% endif %}>In Progress</option>
                                <option value="completed" {% if batch.status == "completed" %}selected{% endif %}>Completed</option>
                                <option value="cancelled" {% if batch.status == "cancelled" %}selected{% endif %}>Cancelled</option>
                            </select>
                        </div>
                        <div class="mb-3">
    <label class="form-label">Progress <span class="text-muted">(0 - 100%)</span></label>
    <input type="number" name="progress" class="form-control" min="0" max="100" value="{{ batch.progress }}" required>
    <div class="form-text">Enter a number between 0 and 100 representing batch completion.</div>
</div>

                        <div class="mb-3">
                            <label class="form-label">Supervisor <span class="text-muted">(Optional)</span></label>
                            <input type="text" name="supervisor" class="form-control" value="{{ batch.supervisor or '' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Notes <span class="text-muted">(Optional)</span></label>
                            <textarea name="notes" class="form-control" rows="3">{{ batch.notes or '' }}</textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Update Batch</button>
                            <a href="/batches" class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

{% endblock %}
