{% extends "base.html" %}

{% block title %}Add Staff{% endblock %}
{% block page_heading %}Add Staff{% endblock %}

{% block content %}

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">

                    <form method="POST" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" name="first_name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" name="last_name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select name="role" class="form-select" required>
                                <option value="">Select a role</option>
                                <option value="Production Supervisor">Production Supervisor</option>
                                <option value="Production Worker">Production Worker</option>
                                <option value="QC Officer">QC Officer</option>
                                <option value="Material Handler">Material Handler</option>
                                <option value="Manager">Manager</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone <span class="text-muted">(Optional)</span></label>
                            <input type="text" name="phone" class="form-control" placeholder="e.g. 0244123456">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email <span class="text-muted">(Optional)</span></label>
                            <input type="email" name="email" class="form-control" placeholder="e.g. john@peellnova.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Date Joined</label>
                            <input type="date" name="date_joined" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Profile Picture <span class="text-muted">(Optional)</span></label>
                            <input type="file" name="profile_pic" class="form-control" accept="image/*">
                            <div class="form-text">Max 2MB. JPG, PNG or GIF.</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Add Staff</button>
                            <a href="/staff" class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

{% endblock %}
