<!DOCTYPE html>
<html>
<head>
    <title>PeellOps - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
        }

        /* Sidebar */
        #sidebar {
            width: 240px;
            min-height: 100vh;
            background-color: #1a1a1a;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px 0;
        }

        #sidebar .brand {
            color: #E87722;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 10px 20px 20px 20px;
            border-bottom: 1px solid #333;
        }

        #sidebar .brand span {
            color: white;
            font-size: 0.8rem;
            display: block;
            font-weight: normal;
        }

        #sidebar a {
            display: block;
            color: #aaaaaa;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 0.95rem;
        }

        #sidebar a:hover {
            color: white;
            background-color: #2a2a2a;
        }

        #sidebar a.active {
            color: white;
            background-color: #E87722;
            border-radius: 6px;
            margin: 0 10px;
            padding: 12px 10px;
        }

        #sidebar .section-label {
            color: #555;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 20px 20px 8px 20px;
        }

        /* Main content */
        #main {
            margin-left: 240px;
            padding: 30px;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        /* Topbar */
        #topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        #topbar h4 {
            margin: 0;
            font-weight: bold;
        }

        #topbar .subtitle {
            color: #888;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">

        <div class="brand">
            🍍 PeellOps
            <span>Peellnnova Limited</span>
        </div>

        <div class="section-label">Main Menu</div>

        <a href="/" class="{% if request.path == '/' %}active{% endif %}">
            📊 Dashboard
        </a>
        <a href="/materials" class="{% if request.path == '/materials' %}active{% endif %}">
            🧪 Raw Materials
        </a>
        <a href="/batches" class="{% if request.path == '/batches' %}active{% endif %}">
            ⚙️ Production
        </a>
        <a href="/staff" class="{% if request.path == '/staff' %}active{% endif %}">
    👥 Staff
</a>
    <a href="/reports" class="{% if request.path == '/reports' %}active{% endif %}">
    📈 Reports
</a>
    </div>

    <!-- Main Content -->
    <div id="main">

        <!-- Topbar -->
        <div id="topbar">
            <div>
                <h4>{% block page_heading %}{% endblock %}</h4>
                <div class="subtitle">Peellnova Operations</div>
            </div>
        </div>

        <!-- Page Content -->
        {% block content %}
        {% endblock %}

    </div>

    <!-- Delete Confirmation Script -->
    <script>
        function confirmDelete(url, itemName) {
            if (confirm('Are you sure you want to delete "' + itemName + '"? This cannot be undone.')) {
                window.location.href = url;
            }
        }
    </script>

</body>
</html>
