{% extends "base.html" %}

{% block title %}Add Batch{% endblock %}
{% block page_heading %}Add Batch{% endblock %}

{% block content %}

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" name="product_name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Product Type</label>
                            <select name="product_type" class="form-select" required>
                                <option value="coil">Coil</option>
                                <option value="aerosol">Aerosol</option>
                                <option value="cream">Cream</option>
                                <option value="essence">Essence</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        {% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="mb-3">
    <label class="form-label">Raw Material Used</label>
    <select name="material_id" class="form-select" required>
        <option value="">Select a material</option>
        {% for material in materials %}
        <option value="{{ material.id }}">{{ material.name }} — {{ material.quantity }} {{ material.unit }} available</option>
        {% endfor %}
    </select>
</div>
                        <div class="mb-3">
                            <label class="form-label">Peels Used (kg)</label>
                            <input type="number" step="0.1" name="peels_used" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantity Produced (units)</label>
                            <input type="number" name="quantity_produced" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" name="start_date" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">End Date</label>
                            <input type="date" name="end_date" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select">
                                <option value="planned">Planned</option>
                                <option value="in_progress">In Progress</option>
                                <option value="completed">Completed</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="mb-3">
    <label class="form-label">Progress <span class="text-muted">(0 - 100%)</span></label>
    <input type="number" name="progress" class="form-control" min="0" max="100" value="0" required>
    <div class="form-text">Enter a number between 0 and 100 representing batch completion.</div>
</div>

                        <div class="mb-3">
                            <label class="form-label">Supervisor <span class="text-muted">(Optional)</span></label>
                            <input type="text" name="supervisor" class="form-control" placeholder="e.g. Akosua Frimpong">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Notes <span class="text-muted">(Optional)</span></label>
                            <textarea name="notes" class="form-control" rows="3" placeholder="Any observations or remarks"></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">Create Batch</button>
                            <a href="/batches" class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

{% endblock %}
