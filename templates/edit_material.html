{% extends "base.html" %}

{% block title %}Edit Material{% endblock %}
{% block page_heading %}Edit Material{% endblock %}

{% block content %}

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Material Name</label>
                            <input type="text" name="name" class="form-control" value="{{ material.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Material Type</label>
                            <select name="material_type" class="form-select" required>
                                <option value="pineapple_peel" {% if material.material_type == "pineapple_peel" %}selected{% endif %}>Pineapple Peel</option>
                                <option value="orange_peel" {% if material.material_type == "orange_peel" %}selected{% endif %}>Orange Peel</option>
                                <option value="citronella" {% if material.material_type == "citronella" %}selected{% endif %}>Citronella</option>
                                <option value="neem" {% if material.material_type == "neem" %}selected{% endif %}>Neem</option>
                                <option value="eucalyptus" {% if material.material_type == "eucalyptus" %}selected{% endif %}>Eucalyptus</option>
                                <option value="other" {% if material.material_type == "other" %}selected{% endif %}>Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <input type="number" step="0.1" name="quantity" class="form-control" value="{{ material.quantity }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Unit</label>
                            <select name="unit" class="form-select">
                                <option value="kg" {% if material.unit == "kg" %}selected{% endif %}>kg</option>
                                <option value="L" {% if material.unit == "L" %}selected{% endif %}>L (Litres)</option>
                                <option value="units" {% if material.unit == "units" %}selected{% endif %}>units</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Minimum Stock Level</label>
                            <input type="number" step="0.1" name="minimum_stock" class="form-control" value="{{ material.minimum_stock }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Supplier <span class="text-muted">(Optional)</span></label>
                            <input type="text" name="supplier" class="form-control" value="{{ material.supplier or '' }}">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Update Material</button>
                            <a href="/materials" class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

{% endblock %}
